name: Actualizar informe Ag. Garcés

on:
  schedule:
    # 07:00 y 14:00 hora de Chile en horario de verano (UTC-3). En invierno corre una hora antes.
    - cron: '0 10 * * *'
    - cron: '0 17 * * *'
  workflow_dispatch: {}

permissions:
  contents: write

concurrency:
  group: actualizar-informe-garces
  cancel-in-progress: false

jobs:
  actualizar:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Instalar dependencias
        run: pip install google-cloud-bigquery==3.25.0 pandas==2.2.3 numpy==2.1.3 cryptography==43.0.3
      - name: Credencial de BigQuery
        env:
          GCP_SA_KEY: ${{ secrets.GCP_SA_KEY }}
        run: printf '%s' "$GCP_SA_KEY" > "$RUNNER_TEMP/sa.json"
      - name: Descargar datos y armar el informe cifrado
        env:
          GOOGLE_APPLICATION_CREDENTIALS: ${{ runner.temp }}/sa.json
          REPORT_PASSWORD: ${{ secrets.REPORT_PASSWORD }}
        run: python garces/scripts/actualizar.py
      - name: Publicar
        run: |
          git config user.name "blum-bot"
          git config user.email "actions@users.noreply.github.com"
          git add garces/reporte.enc.json garces/index.html
          git diff --cached --quiet || git commit -m "Actualización automática de datos"
          git push
